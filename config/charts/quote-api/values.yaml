image:
  repository: ghcr.io/benhuhaudau/quote-api
  tag: latest          # ArgoCD pins the digest/SHA tag via values overrides in the Application
replicas: 3
service:
  port: 80
  targetPort: 8080
ingress:
  className: traefik
  host: ""             # empty = match all hosts; reachable at http://localhost:8080
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
hpa:
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilization: 60
