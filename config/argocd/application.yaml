apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quote-api
  namespace: argocd
spec:
  project: default
  source:
    # tokens __REPO_URL__ and __IMAGE_TAG__ are substituted by scripts/20-deploy.sh
    repoURL: __REPO_URL__
    targetRevision: HEAD
    path: config/charts/quote-api
    helm:
      values: |
        image:
          repository: __IMAGE_REPO__
          tag: __IMAGE_TAG__
  destination:
    server: https://kubernetes.default.svc
    namespace: quote
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 10
