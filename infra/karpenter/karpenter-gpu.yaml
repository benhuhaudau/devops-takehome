---
# 5a: Karpenter for GPU AI inference on EKS.
# Stable GA API: karpenter.sh/v1 + karpenter.k8s.aws/v1 (Karpenter v1.x;
# the v1beta1 groups are deprecated in favor of these: verified against
# current Karpenter docs, not from memory).
#
# Design:
#   * TWO pools: GPU-spot (weight 80) preferred for cost, GPU-on-demand
#     (weight 20) fallback: Karpenter tries pools in descending weight order.
#   * Same instance-family/size requirements + same EC2NodeClass, so the
#     fallback has identical capabilities.
#   * nvidia.com/gpu=true:NoSchedule taint (matches the review requirement and
#     the cluster design in Part 2): only pods tolerating GPU schedule here.
#   * consolidationPolicy WhenEmpty + consolidateAfter 5m: never consolidate
#     underutilized GPU nodes: killing a streaming inference request mid-TCP
#     is a 5xx for a customer. Nodes are only removed when empty (# plus expiry).
#   * disruption budgets rate-limit voluntary disruption: max 10% at a time,
#     and a 6h freeze window during the nightly spot-reclaim peak (01:00-07:00).
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ai-inference-gpu
spec:
  amiSelectorTerms:
    - alias: nvidia@latest        # official NVIDIA GPU AMI; stable per k8s minor
  role: KarpenterNodeInstanceRole-acme
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: acme-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: acme-eks
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ai-inference-gpu-spot
spec:
  weight: 80
  template:
    metadata:
      labels:
        acme.io/intent: ai-inference
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: node.kubernetes.io/instance-family
          operator: In
          values: [g5]            # NVIDIA A10G: swap g6/g6e by region/need
        - key: node.kubernetes.io/instance-size
          operator: In
          values: [2xlarge]       # enough VRAM for typical inference images
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ai-inference-gpu
  limits:
    cpu: "64"
    memory: 256Gi
    nvidia.com/gpu: "4"
  disruption:
    budgets:
      - nodes: "10%"
        duration: 6h             # freeze churn 01:00-07:00 (cheap spot window)
        schedule:
          cron: "0 1 * * *"
          location: "UTC"
  consolidationPolicy: WhenEmpty
  consolidateAfter: 5m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ai-inference-gpu-ondemand
spec:
  # lower weight = only used when the spot pool cannot satisfy (reclaim, cap)
  weight: 20
  template:
    metadata:
      labels:
        acme.io/intent: ai-inference
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: node.kubernetes.io/instance-family
          operator: In
          values: [g5]
        - key: node.kubernetes.io/instance-size
          operator: In
          values: [2xlarge]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ai-inference-gpu
  limits:
    cpu: "64"
    memory: 256Gi
    nvidia.com/gpu: "4"
  disruption:
    budgets:
      - nodes: "10%"
  consolidationPolicy: WhenEmpty
  consolidateAfter: 5m
